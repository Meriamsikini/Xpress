<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inscription - Xpress Chatbot</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="login-container">
    <h2>Créer un compte</h2>
    <input type="email" id="email" placeholder="Email">
    <div class="password-container">
      <input type="password" id="password" placeholder="Mot de passe">
<i class="fa-solid fa-eye" id="toggle-pass"></i>
    </div>
    <button onclick="register()">S'inscrire</button>
    <p>Déjà inscrit ? <a href="/login">Se connecter</a></p>
    <div id="register-alert" class="alert" style="display:none;"></div>
  </div>

  <script>
  // toggle password visibility for this page
  const togglePass = document.getElementById("toggle-pass");
const passwordInput = document.getElementById("password");

togglePass.addEventListener("click", () => {
  if(passwordInput.type === "password") {
    passwordInput.type = "text";
    togglePass.classList.replace("fa-eye", "fa-eye-slash");
  } else {
    passwordInput.type = "password";
    togglePass.classList.replace("fa-eye-slash", "fa-eye");
  }
});


  async function register() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const alertDiv = document.getElementById("register-alert");

    alertDiv.style.display = "block";
    alertDiv.className = "alert";

    try {
      const res = await fetch("/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({email, password})
      });

      const data = await res.json();

      if (data.error) {
        alertDiv.textContent = data.error;
        alertDiv.className = "alert alert-error";
      } else {
        alertDiv.textContent = data.message || "Inscription réussie";
        alertDiv.className = "alert alert-success";
        setTimeout(() => { window.location.href = "/login"; }, 1200);
      }
    } catch (err) {
      alertDiv.textContent = "Erreur réseau.";
      alertDiv.className = "alert alert-error";
    }
  }
  </script>
</body>
</html>
