<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xpress Chatbot</title>
  
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>
  <!-- Sidebar: controls are buttons, history list is inside -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-top">
        <button class="sidebar-btn" id="disconnect">
  <i class="fa-solid fa-right-from-bracket"></i> <span class="text">Se déconnecter</span>
</button>

  <button class="sidebar-btn" id="history">
  <i class="fa-solid fa-clock-rotate-left"></i> <span class="text">Historique</span>
</button>

  
</div>

    </div>
    <div id="history-list" class="history-list" style="display:none;"></div>
  </div>

  <div class="container">
    <h1>Sur quoi travaillez-vous ?</h1>
    <div class="chat-box" id="chat-box"></div>
    <div class="search-box">
      <button class="plus-btn" id="new-convo"><i class="fa-solid fa-plus"></i></button>
      <input type="text" id="user-input" placeholder="Poser une question..." autocomplete="off"/>
      <div class="icons">
        <button class="icon-btn" id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>
  <button id="theme-toggle" class="theme-btn"><i id="theme-icon" class="fa-solid fa-moon"></i></button>

  <!-- Confirmation modal for logout -->
  <div id="confirm-modal" class="modal" style="display:none;">
    <div class="modal-overlay"></div>
    <div class="modal-dialog">
      <h3 id="co">Confirmation</h3>
      <p id="desconect-cofirmation">Voulez-vous vraiment vous déconnecter ?</p>
      <div class="modal-actions">
        <button id="confirm-yes" class="btn btn-primary">Se déconnecter</button>
        <button id="confirm-no" class="btn">Annuler</button>
      </div>
    </div>
  </div>

  <!-- Delete confirmation modal (for deleting a single conversation) -->
  <div id="delete-modal" class="modal" style="display:none;">
    <div class="modal-overlay"></div>
    <div class="modal-dialog">
      <h3 id="co">Supprimer la conversation</h3>
      <p id="delete-message">Êtes-vous sûr de vouloir supprimer cette conversation ?</p>
      <div id="delete-error" style="display:none;color:#7a1414;background:#ffecec;padding:8px;border-radius:6px;margin-top:8px;font-size:0.9rem;"></div>
      <div class="modal-actions">
        <button id="delete-confirm" class="btn btn-primary">Supprimer</button>
        <button id="delete-cancel" class="btn">Annuler</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
